[package]
name = "pingr-cli"
description = "Command-line interface for the pingr network stability tracker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "pingr"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
jiff = "0.2.38"
pingr-engine.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
toml = "1.1.8"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
